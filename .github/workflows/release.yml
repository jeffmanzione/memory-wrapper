# Releases a version of this module: tags a commit whose MODULE.bazel has the
# version, publishes a GitHub release with the source archive, and asks
# jeffmanzione/bazel-registry to add the version.
#
# Run it from the Actions tab (or `gh workflow run release.yml -f version=X.Y.Z`).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3
        required: true
      dry_run:
        description: Build, test and package without tagging or publishing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      USE_BAZEL_VERSION: 8.4.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          MODULE=$(sed -nE 's/^ *name = "([^"]+)",.*/\1/p' MODULE.bazel | head -1)
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "Releasing $MODULE $VERSION from $GITHUB_SHA."

      # The branch keeps version 0.0.0; only the tagged commit has the version.
      - name: Make release commit
        run: |
          sed -i -E '0,/^( *)version = "[^"]*",/s//\1version = "'"$VERSION"'",/' MODULE.bazel
          grep -q "version = \"$VERSION\"," MODULE.bazel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag -a "v$VERSION" -m "$MODULE $VERSION"

      - name: Build and test
        run: |
          bazel build //...
          # Exit code 4 means there are no test targets.
          bazel test --test_output=errors //... || [ $? -eq 4 ]

      - name: Package
        run: |
          git archive --format=tar.gz --prefix "$MODULE-$VERSION/" \
            --output "$MODULE-$VERSION.tar.gz" "v$VERSION"
          git archive --format=zip --prefix "$MODULE-$VERSION/" \
            --output "$MODULE-$VERSION.zip" "v$VERSION"
          echo "ARCHIVE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/$MODULE-$VERSION.tar.gz" >> "$GITHUB_ENV"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "v$VERSION"
          gh release create "v$VERSION" "$MODULE-$VERSION.tar.gz" "$MODULE-$VERSION.zip" \
            --title "$VERSION" --generate-notes --verify-tag

      # Needs a REGISTRY_TOKEN secret: a fine-grained token with Actions
      # read and write access to jeffmanzione/bazel-registry.
      - name: Add to registry
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No REGISTRY_TOKEN secret. Run add-version.yml in jeffmanzione/bazel-registry with archive_url=$ARCHIVE_URL."
            exit 0
          fi
          gh workflow run add-version.yml -R jeffmanzione/bazel-registry -f archive_url="$ARCHIVE_URL"
          echo "Started add-version.yml in jeffmanzione/bazel-registry for $ARCHIVE_URL."
